
name: Stimmen aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: stimmen-aktualisieren
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Stimmen aktualisieren
        run: python aktualisieren.py

      - name: Neue Daten speichern
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add daten.json

          if git diff --cached --quiet; then
            echo "Keine Änderungen vorhanden."
            exit 0
          fi

          git commit -m "Stimmen aktualisieren"

          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Stimmen erfolgreich gespeichert."
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            echo "Versuch $attempt fehlgeschlagen."
            sleep 5
          done

          echo "Änderungen konnten nicht hochgeladen werden."
          exit 1
