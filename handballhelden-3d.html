<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Handballhelden – 3D-Testraum</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#100d1d;color:#fff;font-family:system-ui,Arial,sans-serif}#room{height:100svh;min-height:530px;position:relative;overflow:hidden;background:#110d1e}canvas{display:block;width:100%;height:100%}.overlay{position:absolute;left:clamp(16px,4vw,65px);top:24px;pointer-events:none;text-shadow:0 2px 16px #000}.overlay small{letter-spacing:.24em;color:#b5e4f6;font-weight:800}.overlay h1{font-size:clamp(2rem,5vw,4.7rem);line-height:.94;letter-spacing:-.07em;margin:14px 0}.overlay p{color:#d8d0e8;max-width:340px}.down{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);color:white;text-decoration:none;padding:12px 24px;background:#271d3de8;border:1px solid #b99ddd;border-radius:30px;font-weight:750;text-align:center;white-space:nowrap}.help{position:absolute;right:22px;top:25px;color:#d9c9e9;text-align:right;font-size:.82rem}.tip{position:absolute;display:none;background:#23172eea;border:1px solid #caa6eb;padding:10px;border-radius:12px;pointer-events:none;z-index:5;max-width:220px}section#liste{padding:45px 15px 70px;max-width:1150px;margin:auto}h2{font-size:clamp(1.7rem,4vw,3rem);letter-spacing:-.04em;margin:0 0 8px}.muted{color:#c5b8d3}iframe{width:100%;height:1300px;border:1px solid #574568;border-radius:18px;background:#0c1727}#error{color:#ffd7a3}
@media(max-width:600px){.help{top:auto;bottom:90px;right:14px}.overlay p{max-width:230px;font-size:.85rem}iframe{height:1500px}}
</style></head><body>
<div id="room"><div id="scene"></div><div class="overlay"><small>OSTFRIESLAND × HANDBALL</small><h1>HANDBALL<br>HELDEN.</h1><p>802 Geschichten. Ein gemeinsamer Raum.</p><p id="count">Lade Nominierte …</p></div><div class="help">Ziehen: drehen<br>Mausrad: zoomen<br>Figur: Name & Stimmen</div><div id="tip" class="tip"></div><a class="down" href="#liste">↓ Peter, Judith & Rangliste</a></div>
<section id="liste"><h2>Peter, Judith & alle Nominierten</h2><p class="muted">Die bewährte Rangliste mit den bestehenden Such- und Filtermöglichkeiten.</p><iframe src="./" title="Bestehender Handballhelden-Monitor"></iframe><p id="error"></p></section>
<script type="module">
const host=document.querySelector('#scene'),tip=document.querySelector('#tip'),count=document.querySelector('#count');
try{
const T=await import('https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js');
const scene=new T.Scene();scene.background=new T.Color(0x101421);scene.fog=new T.Fog(0x101421,85,180);
const camera=new T.PerspectiveCamera(58,1,.1,250);
const renderer=new T.WebGLRenderer({antialias:false,powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,.8));renderer.setClearColor(0x101421);
host.appendChild(renderer.domElement);
// Only a subtle circular ground surface under the figures; no walls or ceiling.
const ground=new T.Mesh(new T.CircleGeometry(80,64),new T.MeshBasicMaterial({color:0x1c2636,side:T.DoubleSide}));
ground.rotation.x=-Math.PI/2;ground.position.set(0,-.05,-27);scene.add(ground);
const rim=new T.Mesh(new T.RingGeometry(79.7,80,80),new T.MeshBasicMaterial({color:0x33465a,side:T.DoubleSide}));
rim.rotation.x=-Math.PI/2;rim.position.set(0,-.035,-27);scene.add(rim);
const gold=new T.MeshBasicMaterial({color:0xf1b957});
const center=new T.Mesh(new T.IcosahedronGeometry(3,1),gold);center.position.set(0,6,-27);scene.add(center);
const base=new T.Mesh(new T.CylinderGeometry(4.5,5,1,12),new T.MeshBasicMaterial({color:0x4b3b50}));base.position.set(0,.5,-27);scene.add(base);
const ring=new T.Mesh(new T.TorusGeometry(6,.09,5,48),new T.MeshBasicMaterial({color:0xf1b957}));ring.rotation.x=Math.PI/2;ring.position.set(0,.08,-27);scene.add(ring);
const r=await fetch('daten.json?'+Date.now());if(!r.ok)throw Error('daten.json nicht gefunden');
const data=await r.json(),people=(data.personen||[]).slice().sort((a,b)=>Number(b.votes)-Number(a.votes));
count.textContent=people.length.toLocaleString('de-DE')+' Menschen im Raum';
const n=people.length,bodyGeo=new T.CylinderGeometry(.33,.43,1.5,4),headGeo=new T.IcosahedronGeometry(.4,0),bodyMat=new T.MeshBasicMaterial({color:0xffffff}),headMat=bodyMat;
const bodies=new T.InstancedMesh(bodyGeo,bodyMat,n),heads=new T.InstancedMesh(headGeo,headMat,n);
bodies.instanceMatrix.setUsage(T.StaticDrawUsage);heads.instanceMatrix.setUsage(T.StaticDrawUsage);
const dummy=new T.Object3D(),color=new T.Color();
const locations=[];
people.forEach((p,i)=>{
const t=i/Math.max(1,n-1),angle=i*2.399963229728653,radius=9+Math.sqrt(t)*66,x=Math.cos(angle)*radius,z=-27+Math.sin(angle)*radius;
const special=String(p.id)==='1152'||String(p.id)==='311';
color.setHSL(special?(String(p.id)==='1152'?.10:.49):(.57+(i%7)*.028),special?.9:.52,special?.70:.58);
bodies.setColorAt(i,color);heads.setColorAt(i,color);
const scale=special?1.22:1;
dummy.position.set(x,1.85*scale,z);dummy.scale.setScalar(scale);dummy.updateMatrix();bodies.setMatrixAt(i,dummy.matrix);
dummy.position.set(x,3.0*scale,z);dummy.scale.setScalar(scale);dummy.updateMatrix();heads.setMatrixAt(i,dummy.matrix);
locations.push({x,z});
});
bodies.instanceMatrix.needsUpdate=true;heads.instanceMatrix.needsUpdate=true;
if(bodies.instanceColor)bodies.instanceColor.needsUpdate=true;if(heads.instanceColor)heads.instanceColor.needsUpdate=true;
scene.add(bodies,heads);
let yaw=0,tilt=.24,dist=90,drag=false,lastX=0,lastY=0,moved=false;
const ray=new T.Raycaster(),mouse=new T.Vector2(),target=new T.Vector3(0,4,-22);
function pick(e){const b=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects([heads,bodies],false);return hits.length?people[hits[0].instanceId]:null}
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;moved=false;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointerup',()=>drag=false);
renderer.domElement.addEventListener('pointermove',e=>{if(drag){const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;yaw-=dx*.006;tilt=Math.max(.08,Math.min(.8,tilt+dy*.003));lastX=e.clientX;lastY=e.clientY;tip.style.display='none';needsRender=true}else{const p=pick(e);tip.style.display=p?'block':'none';if(p){const b=host.getBoundingClientRect();tip.style.left=Math.max(4,Math.min(e.clientX-b.left+12,b.width-220))+'px';tip.style.top=Math.max(5,e.clientY-b.top-45)+'px';tip.textContent=p.name+' · '+Number(p.votes||0).toLocaleString('de-DE')+' Stimmen'}}});
renderer.domElement.addEventListener('pointerleave',()=>tip.style.display='none');
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(20,Math.min(135,dist+e.deltaY*.06));needsRender=true},{passive:false});
let needsRender=true;
function resize(){const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);needsRender=true}
window.addEventListener('resize',resize);resize();
function draw(){if(!needsRender)return;needsRender=false;camera.position.set(Math.sin(yaw)*dist*Math.cos(tilt),4+Math.sin(tilt)*dist,-22+Math.cos(yaw)*dist*Math.cos(tilt));camera.lookAt(target);renderer.render(scene,camera)}
function tick(){requestAnimationFrame(tick);draw()}tick();
}catch(e){count.textContent='3D konnte nicht geladen werden';document.querySelector('#error').textContent=String(e)}
</script></body></html>
